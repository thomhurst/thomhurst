<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Tom Longhurst</title>
<meta name="description" content="Open-source libraries for building, testing and running .NET: TUnit, ModularPipelines, Dekaf, Respire, Kevlar and BDTest.">
<meta property="og:title" content="Tom Longhurst">
<meta property="og:description" content="Open-source libraries for building, testing and running .NET.">

<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315181f'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='800' fill='%23eef0f5' text-anchor='middle'%3ETL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --ground: oklch(0.14 0.006 260);
    --ink: oklch(0.95 0.006 260);
    --mono: 'Martian Mono', ui-monospace, monospace;
  }
  body { margin: 0; background: var(--ground); color: var(--ink); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: .75; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  input[type=range] { accent-color: currentColor; }
  input::placeholder { color: oklch(0.55 0.01 90); }
  noscript { display: block; padding: 40px; font-family: 'Schibsted Grotesk', sans-serif; }

  .wrap { max-width: 1280px; margin: 0 auto; padding-left: 40px; padding-right: 40px; box-sizing: border-box; }
  .stage { padding: 48px; }
  .tile:hover { background: var(--hov) !important; }
  .chip:hover { border-color: var(--acc) !important; }
  .next:hover { color: var(--fg) !important; }

  @media (max-width: 640px) {
    .wrap { padding-left: 16px; padding-right: 16px; }
    .stage { padding: 24px 16px; }
    .demo { padding: 20px 16px !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<noscript><a href="https://github.com/thomhurst">Tom Longhurst on GitHub</a></noscript>

<script type="module">
import { html, render } from 'https://cdn.jsdelivr.net/npm/lit-html@3.1.4/+esm';
import { live } from 'https://cdn.jsdelivr.net/npm/lit-html@3.1.4/directives/live.js/+esm';

const P = [
  { id: 'tunit', name: 'TUnit', pkg: 'TUnit', tag: 'Test framework', h: 150, docs: 'https://tunit.dev',
    headline: 'Tests run in parallel by default. Opt out per test when you need to.',
    blurb: 'A modern testing framework for .NET. Tests are discovered by source generators at compile time and work with Native AOT. Run the suite, then switch to [NotInParallel].',
    code: '[Test]\n[Arguments(1, 2, 3)]\n[Arguments(2, 2, 4)]\npublic async Task Add(int a, int b, int expected)\n{\n    var result = Calculator.Add(a, b);\n\n    await Assert.That(result).IsEqualTo(expected);\n}' },
  { id: 'modularpipelines', name: 'ModularPipelines', pkg: 'ModularPipelines', tag: 'Pipelines in C#', h: 235,
    headline: 'CI/CD pipelines written as C# modules, with dependencies the runner understands.',
    blurb: 'Each step is a strongly-typed module. Declare what it depends on and independent modules run in parallel. Turn on the flaky broker to see a retry.',
    code: '[DependsOn<BuildModule>]\npublic class TestModule : Module<CommandResult>\n{\n    protected override async Task<CommandResult?> ExecuteAsync(\n        IPipelineContext context, CancellationToken ct)\n    {\n        return await context.DotNet()\n            .Test(new DotNetTestOptions(), ct);\n    }\n}' },
  { id: 'dekaf', name: 'Dekaf', pkg: 'Dekaf', tag: 'Kafka client', h: 45,
    headline: 'Taking the Java out of Kafka.',
    blurb: 'A Kafka client written in .NET, for .NET. Produce a burst, change the rate, or pause the consumer and watch lag build up per partition.',
    code: 'await using var producer = Kafka\n    .CreateProducer<string, Order>()\n    .WithBootstrapServers("localhost:9092")\n    .Build();\n\nawait producer.ProduceAsync("orders", order.Id, order);' },
  { id: 'respire', name: 'Respire', pkg: 'Respire', tag: 'RESP client', h: 15,
    headline: 'Redis replies come back as the .NET types you expected.',
    blurb: 'A fast, modern RESP client for Redis, Valkey, KeyDB and other RESP-compatible servers. Run a command and see the typed reply; expiries count down in the keyspace.',
    code: 'await using var client = await RespireClient\n    .ConnectAsync("localhost:6379");\n\nawait client.SetAsync("session:42", "tom",\n    expiry: TimeSpan.FromSeconds(8));\n\nstring? name = await client.GetAsync("session:42");' },
  { id: 'kevlar', name: 'Kevlar', pkg: 'Kevlar', tag: 'Resilience', h: 85,
    headline: 'Retries, circuit breakers and timeouts you can read top to bottom.',
    blurb: 'Fast, allocation-conscious resilience for .NET: retries, circuit breakers, timeouts, rate limiting, hedging and fallbacks in one fluent API. Raise the failure rate to trip the breaker.',
    code: 'var shield = Shield\n    .Timeout(TimeSpan.FromSeconds(2))\n    .Retry(2)\n    .CircuitBreaker();\n\nvar order = await shield.ExecuteAsync(\n    ct => orders.GetAsync(id, ct));' },
  { id: 'bdtest', name: 'BDTest', pkg: 'BDTest', tag: 'BDD testing', h: 335,
    headline: 'Given / When / Then in plain C#, reported in plain English.',
    blurb: 'Behaviour-driven testing for .NET. Steps are ordinary methods and the report reads like the spec. Introduce a bug to see how a failure is reported.',
    code: '[Test]\npublic async Task Checkout_applies_discount()\n{\n    await Given(() => ABasketWith(3, "items"))\n        .When(() => TheDiscountCodeIsApplied("TEN"))\n        .Then(() => TheTotalIsReducedBy(10))\n        .BDTestAsync();\n}' },
];
P.forEach(p => { p.repo = p.name; p.url = 'https://github.com/thomhurst/' + p.repo; p.docs = p.docs || 'https://thomhurst.github.io/' + p.repo + '/'; });

// Midnight look: dark page ground, each project's stage tinted by its hue.
const PG = { ground: 'oklch(0.14 0.006 260)', ink: 'oklch(0.95 0.006 260)', muted: 'oklch(0.66 0.01 260)', tile: 'oklch(0.185 0.008 260)', tileHover: 'oklch(0.22 0.01 260)', tileFg: 'oklch(0.9 0.006 260)', ring: 'transparent', stageBorder: 'transparent' };
const theme = h => ({ bg: `oklch(0.2 0.018 ${h})`, panel: `oklch(0.15 0.015 ${h})`, line: `oklch(0.33 0.02 ${h})`, accent: `oklch(0.76 0.14 ${h})`, accentDim: `oklch(0.76 0.14 ${h} / .45)`, fg: 'oklch(0.95 0.008 90)', fg2: 'oklch(0.82 0.01 90)', muted: 'oklch(0.66 0.01 90)' });

const fmt = n => n == null ? '—' : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'k' : String(n);
const sec = ms => (ms / 1000).toFixed(1) + 's';
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const autoplay = !reduceMotion;

// TUnit: 20 tests scheduled across 4 workers or 1.
const TNAMES = ['Add(1,2,3)', 'Add(2,2,4)', 'Divide_by_zero', 'Retries_on_timeout', 'Circuit_opens', 'Applies_discount', 'Empty_total', 'Produces_message', 'Commits_offset', 'Set_then_get', 'Expiry_respected', 'Modules_parallel', 'DependsOn_waits', 'Rejects_expired', 'Accepts_valid', 'Snapshot_matches', 'Hedges_slow', 'Hybrid_cache', 'Parses_config', 'Serialises_order'];
const TT = TNAMES.map((n, i) => ({ n, d: 160 + ((i * 137) % 9) * 75 }));
function sched(lanes) { const free = Array(lanes).fill(0); return TT.map(t => { let l = 0; for (let i = 1; i < lanes; i++) if (free[i] < free[l]) l = i; const s = free[l]; free[l] += t.d; return { ...t, lane: l, start: s }; }); }
const SCH = { par: sched(4), seq: sched(1) };
const SPAN = { par: Math.max(...SCH.par.map(t => t.start + t.d)), seq: Math.max(...SCH.seq.map(t => t.start + t.d)) };

// ModularPipelines: module graph laid out on a 1000x320 canvas.
const PN = [
  { id: 'restore', label: 'Restore', sub: 'dotnet restore', x: 0, y: 125, d: [], ms: 600 },
  { id: 'build', label: 'Build', sub: 'dotnet build', x: 212, y: 125, d: ['restore'], ms: 1100 },
  { id: 'unit', label: 'Unit tests', sub: 'TUnit', x: 425, y: 20, d: ['build'], ms: 1400 },
  { id: 'bdd', label: 'Specs', sub: 'BDTest', x: 425, y: 125, d: ['build'], ms: 1000 },
  { id: 'integ', label: 'Integration', sub: 'Dekaf+Respire', x: 425, y: 230, d: ['build'], ms: 1500 },
  { id: 'pack', label: 'Pack', sub: 'dotnet pack', x: 637, y: 125, d: ['unit', 'bdd', 'integ'], ms: 700 },
  { id: 'publish', label: 'Publish', sub: 'NuGet', x: 850, y: 125, d: ['pack'], ms: 600 },
];
const idlePipe = () => Object.fromEntries(PN.map(n => [n.id, { s: 'idle' }]));

// Dekaf: keys hash to one of 3 partitions; records take DUR ms to reach the consumer.
const KEYS = ['order-17', 'user-42', 'cart-9', 'order-88', 'user-3', 'invoice-5', 'cart-61', 'order-204', 'user-77', 'ship-12'];
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const DUR = 2800;

// BDTest: two scenarios; the first can be broken at step failAt.
const BD = [
  { title: 'Checkout applies a discount code', steps: [['Given', 'a basket with 3 items totalling £30.00'], ['When', 'the discount code "TEN" is applied'], ['Then', 'the total is £27.00'], ['And', 'the receipt shows "TEN"']], failAt: 2 },
  { title: 'An empty basket costs nothing', steps: [['Given', 'an empty basket'], ['When', 'the total is calculated'], ['Then', 'the total is £0.00']] },
];
const BDFLAT = BD.flatMap((s, si) => s.steps.map((st, i) => ({ si, i })));

class Portfolio {
  state = {
    sel: P.some(p => p.id === ls.get('tl-portfolio-sel')) ? ls.get('tl-portfolio-sel') : 'tunit',
    gh: {}, ng: {}, statsStatus: 'loading', copied: false,
    tuMode: 'par', tuT: 0, tuRun: false,
    pst: idlePipe(), plog: [{ t: '> ready', c: 'muted' }], pRunning: false, flaky: true, pNow: 0,
    dkMsgs: [], dkProd: [0, 0, 0], dkCons: [0, 0, 0], dkRate: 6, dkPaused: false, dkNow: Date.now(),
    rsStore: { 'page:views': { v: 41, type: 'long' }, 'user:1:name': { v: 'Tom', type: 'string' } }, rsLog: [], rsInput: '', rsNow: Date.now(),
    kvCells: [], kvCircuit: 'closed', kvFail: 35, kvWin: [], kvN: { ok: 0, retried: 0, failed: 0, short: 0 },
    bdIdx: -1, bdRun: false, bdBroken: false, bdMs: [],
  };
  mid = 0; kvAcc = 0; bdAcc = 0;

  constructor(root) {
    this.root = root;
    this.render();
    this.loadStats();
    this.int = setInterval(() => this.tick(), 50);
    this.autostart(this.state.sel);
  }

  setState(patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch);
    if (!this.queued) { this.queued = true; queueMicrotask(() => { this.queued = false; this.render(); }); }
  }

  async loadStats() {
    const key = 'tl-portfolio-stats-v1';
    let gh = {}, ng = {};
    try { const c = JSON.parse(ls.get(key) || 'null'); if (c && Date.now() - c.t < 3600e3) { gh = c.gh || {}; ng = c.ng || {}; if (P.every(p => gh[p.id] != null && ng[p.id] != null)) return this.setState({ gh, ng, statsStatus: 'live' }); } } catch (e) {}
    await Promise.all(P.map(async p => {
      if (gh[p.id] == null) try { const r = await fetch('https://api.github.com/repos/thomhurst/' + p.repo); if (r.ok) gh[p.id] = (await r.json()).stargazers_count; } catch (e) {}
      if (ng[p.id] == null) try { const r = await fetch('https://azuresearch-usnc.nuget.org/query?q=packageid:' + p.pkg + '&prerelease=true&take=1'); if (r.ok) { const j = await r.json(); if (j.data && j.data[0]) ng[p.id] = j.data[0].totalDownloads; } } catch (e) {}
    }));
    const ok = Object.keys(gh).length + Object.keys(ng).length > 0;
    this.setState({ gh, ng, statsStatus: ok ? 'live' : 'error' });
    if (ok) ls.set(key, JSON.stringify({ t: Date.now(), gh, ng }));
    if (P.some(p => gh[p.id] == null || ng[p.id] == null) && !this.statsRetried) { this.statsRetried = true; setTimeout(() => this.loadStats(), 4000); }
  }

  select(id) {
    this.setState({ sel: id, copied: false });
    ls.set('tl-portfolio-sel', id);
    this.autostart(id);
  }
  autostart(id) {
    if (!autoplay) return;
    if (id === 'tunit') this.tuStart();
    if (id === 'modularpipelines') this.runPipe();
    if (id === 'bdtest') this.bdStart();
    if (id === 'respire' && !this.state.rsLog.length) setTimeout(() => this.rsExec('SET session:42 "tom" EX 8'), 300);
  }

  tick() {
    const s = this.state, now = Date.now();
    if (s.sel === 'tunit' && s.tuRun) { const t = s.tuT + 100; this.setState({ tuT: Math.min(t, SPAN[s.tuMode]), tuRun: t < SPAN[s.tuMode] }); }
    if (s.sel === 'modularpipelines' && s.pRunning) this.pipeTick(now);
    if (s.sel === 'dekaf') this.dkTick(now);
    if (s.sel === 'respire') this.rsTick(now);
    if (s.sel === 'kevlar' && (this.kvAcc += 50) >= 300) { this.kvAcc = 0; this.kvTick(now); }
    if (s.sel === 'bdtest' && s.bdRun && (this.bdAcc += 50) >= 420) { this.bdAcc = 0; this.bdTick(); }
  }

  tuStart = () => this.setState({ tuT: 0, tuRun: true });

  runPipe = () => { this.pStart = Date.now(); this.setState({ pst: idlePipe(), plog: [{ t: '> dotnet run --project Release.Pipeline', c: 'muted' }], pRunning: true, pNow: Date.now() }); };
  pipeTick(now) {
    const st = { ...this.state.pst }, log = [...this.state.plog];
    for (const n of PN) {
      const s = st[n.id];
      if (s.s === 'run' && now >= s.end) {
        if (n.id === 'integ' && this.state.flaky && !s.retried) { st[n.id] = { ...s, s: 'retry', end: now + 800, retried: true }; log.push({ t: '✕ Integration: broker timeout', c: 'red' }, { t: '↻ retry 1/3 in 800ms', c: 'amber' }); }
        else { st[n.id] = { ...s, s: 'done' }; log.push({ t: '✓ ' + n.label + ' ' + sec(now - s.t0), c: 'green' }); }
      } else if (s.s === 'retry' && now >= s.end) st[n.id] = { ...s, s: 'run', a: now, end: now + n.ms * 0.7 };
    }
    for (const n of PN) if (st[n.id].s === 'idle' && n.d.every(d => st[d].s === 'done')) { st[n.id] = { s: 'run', t0: now, a: now, end: now + n.ms * (0.8 + Math.random() * 0.4) }; log.push({ t: '▸ ' + n.label, c: 'muted' }); }
    const all = PN.every(n => st[n.id].s === 'done');
    if (all) log.push({ t: 'Pipeline succeeded in ' + sec(now - this.pStart), c: 'acc' });
    this.setState({ pst: st, plog: log.slice(-12), pRunning: !all, pNow: now });
  }

  spawn(arr, prod, born) { const key = KEYS[Math.floor(Math.random() * KEYS.length)], p = hash(key) % 3; arr.push({ id: ++this.mid, p, key, off: prod[p], born }); prod[p]++; }
  dkTick(now) {
    const dt = now - (this.dkLast || now); this.dkLast = now;
    let msgs = this.state.dkMsgs.slice(); const prod = this.state.dkProd.slice(), cons = this.state.dkCons.slice();
    this.dkAcc = Math.min(5, (this.dkAcc || 0) + dt * this.state.dkRate / 1000);
    while (this.dkAcc >= 1) { this.dkAcc--; this.spawn(msgs, prod, now); }
    if (!this.state.dkPaused) { const keep = []; for (const m of msgs) { if (now - m.born >= DUR) cons[m.p]++; else keep.push(m); } msgs = keep; }
    this.setState({ dkMsgs: msgs.slice(-150), dkProd: prod, dkCons: cons, dkNow: now });
  }
  dkBurst = () => { const msgs = this.state.dkMsgs.slice(), prod = this.state.dkProd.slice(), now = Date.now(); for (let i = 0; i < 12; i++) this.spawn(msgs, prod, now + i * 90); this.setState({ dkMsgs: msgs, dkProd: prod }); };

  rsTick(now) {
    const st = this.state.rsStore; let changed = false; const next = {};
    for (const k in st) { if (st[k].exp && st[k].exp <= now) { changed = true; continue; } next[k] = st[k]; }
    this.setState(changed ? { rsStore: next, rsNow: now } : { rsNow: now });
  }
  rsExec(raw) {
    const cmd = raw.trim(); if (!cmd) return;
    const toks = cmd.match(/"[^"]*"|\S+/g) || []; const op = (toks[0] || '').toUpperCase(); const a = toks.slice(1).map(t => t.replace(/^"|"$/g, ''));
    const now = Date.now(), st = { ...this.state.rsStore }; let type, val;
    const live = k => st[k] && (!st[k].exp || st[k].exp > now) ? st[k] : null;
    if (op === 'SET' && a.length >= 2) { const ex = a[2] && a[2].toUpperCase() === 'EX' ? +a[3] : 0; st[a[0]] = { v: a[1], type: 'string', exp: ex ? now + ex * 1000 : null, ttl: ex * 1000 }; type = 'bool'; val = 'true'; }
    else if (op === 'GET' && a[0]) { const e = live(a[0]); type = 'string?'; val = e ? '"' + e.v + '"' : 'null'; }
    else if (op === 'INCR' && a[0]) { const e = live(a[0]); const n = (e ? +e.v : 0) + 1; if (isNaN(n)) { type = 'error'; val = 'value is not an integer'; } else { st[a[0]] = { ...(e || {}), v: n, type: 'long' }; type = 'long'; val = String(n); } }
    else if (op === 'DEL' && a[0]) { type = 'bool'; val = String(!!live(a[0])); delete st[a[0]]; }
    else if (op === 'EXPIRE' && a[1]) { const e = live(a[0]); type = 'bool'; val = String(!!e); if (e) st[a[0]] = { ...e, exp: now + a[1] * 1000, ttl: a[1] * 1000 }; }
    else if (op === 'TTL' && a[0]) { const e = live(a[0]); type = 'TimeSpan?'; val = e && e.exp ? '00:00:' + String(Math.ceil((e.exp - now) / 1000)).padStart(2, '0') : 'null'; }
    else if (op === 'KEYS') { type = 'string[]'; val = '[' + Object.keys(st).filter(live).map(k => '"' + k + '"').join(', ') + ']'; }
    else { type = 'error'; val = 'try SET, GET, INCR, DEL, EXPIRE, TTL, KEYS'; }
    this.setState(s => ({ rsStore: st, rsInput: '', rsLog: [...s.rsLog, { a: '>', b: cmd, k: 'cmd' }, { a: type, b: val, k: type === 'error' ? 'err' : 'rep' }].slice(-18) }));
  }

  kvTick(now) {
    const s = this.state, p = s.kvFail / 100;
    let circuit = s.kvCircuit, win = s.kvWin, out;
    const n = { ...s.kvN };
    if (circuit === 'open' && now < this.kvOpenUntil) out = 'short';
    else {
      if (circuit === 'open') circuit = 'half';
      if (circuit === 'half') { const ok = Math.random() > p; out = ok ? 'ok' : 'failed'; if (ok) { circuit = 'closed'; win = []; } else { circuit = 'open'; this.kvOpenUntil = now + 2400; } }
      else {
        let tries = 0, ok = false; while (tries < 3 && !ok) { ok = Math.random() > p; tries++; }
        out = ok ? (tries === 1 ? 'ok' : 'retried') : 'failed';
        win = [...win, !ok].slice(-8);
        if (win.filter(Boolean).length >= 4) { circuit = 'open'; this.kvOpenUntil = now + 2400; win = []; }
      }
    }
    n[out]++;
    this.setState({ kvCircuit: circuit, kvWin: win, kvN: n, kvCells: [...s.kvCells, out].slice(-60) });
  }

  bdStart = () => { this.bdAcc = 0; this.setState({ bdIdx: 0, bdRun: true, bdMs: [] }); };
  bdTick() {
    const s = this.state; let i = s.bdIdx; const ms = [...s.bdMs];
    ms[i] = Math.round(3 + Math.random() * 40); i++;
    if (s.bdBroken && BDFLAT[i - 1] && BDFLAT[i - 1].si === 0 && BDFLAT[i - 1].i === BD[0].failAt) { while (BDFLAT[i] && BDFLAT[i].si === 0) i++; }
    this.setState({ bdIdx: i, bdMs: ms, bdRun: i < BDFLAT.length });
  }

  vals() {
    const s = this.state, cur0 = P.find(p => p.id === s.sel) || P[0];
    const stg = theme(cur0.h), acc = stg.accent;
    const projects = P.map((p, i) => {
      const on = p.id === s.sel, t = theme(p.h);
      return { ...p, on, num: String(i + 1).padStart(2, '0'), stars: fmt(s.gh[p.id]), dl: fmt(s.ng[p.id]), accent: t.accent,
        tileBg: on ? t.bg : PG.tile, tileFg: on ? t.fg : PG.tileFg, tileHover: on ? t.bg : PG.tileHover, tileRing: on ? t.accent : PG.ring };
    });
    const ci = P.indexOf(cur0), cur = projects[ci], nxt = P[(ci + 1) % P.length];
    const sum = o => { const v = Object.values(o); return v.length ? v.reduce((a, b) => a + b, 0) : null; };

    const mode = s.tuMode, t = s.tuT, dom = SPAN.seq;
    const tuLanes = Array.from({ length: mode === 'par' ? 4 : 1 }, (_, l) => ({
      label: mode === 'par' ? 'worker ' + (l + 1) : 'sequential',
      blocks: SCH[mode].filter(b => b.lane === l && b.start < t).map(b => ({ n: b.n, left: (b.start / dom * 100) + '%', width: (Math.min(b.d, t - b.start) / dom * 100) + '%', bg: t >= b.start + b.d ? acc : stg.accentDim })),
    }));
    const segOn = { bg: acc, fg: stg.bg }, segOff = { bg: 'transparent', fg: stg.fg2 };

    const C3 = { green: 'oklch(0.78 0.15 155)', amber: 'oklch(0.8 0.14 75)', red: 'oklch(0.7 0.17 25)', muted: stg.muted, acc };
    const pNodes = PN.map(n => {
      const st = s.pst[n.id];
      const border = st.s === 'done' ? C3.green : st.s === 'run' ? acc : st.s === 'retry' ? C3.amber : stg.line;
      const pct = st.s === 'done' ? '100%' : st.s === 'run' ? Math.min(100, ((s.pNow - st.a) / (st.end - st.a)) * 100) + '%' : '0%';
      return { ...n, left: n.x / 10 + '%', top: n.y / 320 * 100 + '%', border, pct, subColor: st.s === 'retry' ? C3.amber : C3.muted, sub: st.s === 'retry' ? 'retrying…' : n.sub };
    });
    const byId = Object.fromEntries(PN.map(n => [n.id, n]));
    const pEdges = PN.flatMap(n => n.d.map(d => { const a = byId[d], x1 = a.x + 150, y1 = a.y + 35, x2 = n.x, y2 = n.y + 35, mx = (x1 + x2) / 2; return { d: `M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`, color: s.pst[d].s === 'done' ? acc : stg.line }; }));

    const dkMsgs = s.dkMsgs.map(m => { const age = s.dkNow - m.born, x = Math.max(0, Math.min(age / DUR, s.dkPaused ? 0.97 : 1)); return { key: m.key, off: m.off, left: `calc(${14 + x * 72}% - ${x * 40}px)`, top: m.p * 72 + 16, op: age < 0 ? 0 : 1 }; });
    const dkParts = [0, 1, 2].map(i => { const lag = s.dkProd[i] - s.dkCons[i]; return { i, top: i * 72, prod: s.dkProd[i], lag, lagColor: lag > 8 ? 'oklch(0.72 0.17 25)' : stg.fg2 }; });

    const rsKeys = Object.entries(s.rsStore).map(([k, e]) => ({ key: k, val: e.type === 'string' ? '"' + e.v + '"' : String(e.v), ttl: e.exp ? Math.max(0, (e.exp - s.rsNow) / 1000).toFixed(1) + 's' : 'no expiry', pct: e.exp ? Math.max(0, (e.exp - s.rsNow) / e.ttl * 100) + '%' : '100%' }));
    const rsLog = s.rsLog.map(l => ({ a: l.a, b: l.b, c1: l.k === 'cmd' ? acc : l.k === 'err' ? 'oklch(0.72 0.17 25)' : stg.muted, c2: l.k === 'cmd' ? stg.fg : l.k === 'err' ? 'oklch(0.72 0.17 25)' : acc }));
    const rsChips = ['SET session:42 "tom" EX 8', 'GET session:42', 'INCR page:views', 'TTL session:42', 'DEL user:1:name', 'KEYS *'];

    const kvMap = { ok: [acc, acc], retried: ['oklch(0.72 0.15 45)', 'oklch(0.72 0.15 45)'], failed: ['oklch(0.62 0.18 25)', 'oklch(0.62 0.18 25)'], short: ['transparent', stg.muted] };
    const kvCells = Array.from({ length: 60 }, (_, i) => { const o = s.kvCells[i - (60 - s.kvCells.length)]; const c = o ? kvMap[o] : [stg.panel, 'transparent']; return { bg: c[0], ring: c[1] }; });
    const kvSt = k => { const on = s.kvCircuit === k, col = k === 'closed' ? acc : k === 'open' ? 'oklch(0.62 0.18 25)' : 'oklch(0.72 0.15 45)'; return { b: on ? col : stg.line, bg: on ? col : 'transparent', fg: on ? stg.bg : stg.muted }; };

    let flat = 0;
    const bdScen = BD.map((sc, si) => {
      let failed = false, done = true;
      const steps = sc.steps.map(([kw, text], i) => {
        const idx = flat++, past = idx < s.bdIdx, isFail = s.bdBroken && si === 0 && i === sc.failAt;
        const skipped = s.bdBroken && si === 0 && i > sc.failAt && s.bdIdx > idx - (i - sc.failAt);
        let icon = '·', color = stg.muted, op = 0.45, ms = '';
        if (past && isFail) { icon = '✕'; color = 'oklch(0.7 0.17 25)'; op = 1; ms = s.bdMs[idx] + 'ms'; failed = true; }
        else if (past && !(s.bdBroken && si === 0 && i > sc.failAt)) { icon = '✓'; color = acc; op = 1; ms = s.bdMs[idx] + 'ms'; }
        else if (skipped && failed) { icon = '–'; op = 0.6; ms = 'skipped'; }
        else if (idx === s.bdIdx && s.bdRun) { icon = '▸'; color = acc; op = 1; done = false; }
        else done = false;
        return { kw, text, icon, color, op, ms };
      });
      const status = s.bdIdx < 0 ? 'Not run' : failed ? 'Failed' : done ? 'Passed' : 'Running';
      return { title: sc.title, steps, status, err: failed ? 'Expected the total to be £27.00 but it was £30.00' : '',
        pillBg: failed ? 'oklch(0.62 0.18 25)' : status === 'Passed' ? acc : stg.panel, pillFg: failed || status === 'Passed' ? stg.bg : stg.fg2 };
    });

    return {
      s, projects, cur, stg, acc, nxt,

      statsNote: s.statsStatus === 'live' ? 'live · GitHub + NuGet' : s.statsStatus === 'loading' ? 'fetching live stats…' : 'live stats unavailable',

      C3, pNodes, pEdges, dkMsgs, dkParts, rsKeys, rsLog, rsChips, kvCells, kc: kvSt('closed'), ko: kvSt('open'), kh: kvSt('half'), bdScen,

            <div style="display:flex;gap:32px;flex-wrap:wrap">
              <div style="display:flex;flex-direction:column;gap:4px"><span style="font-weight:800;font-size:32px;letter-spacing:-.04em;line-height:1">${v.totStars}</span><span style="font:400 11px ${mono};color:${PG.muted}">GitHub stars</span></div>
              <div style="display:flex;flex-direction:column;gap:4px"><span style="font-weight:800;font-size:32px;letter-spacing:-.04em;line-height:1">${v.totDl}</span><span style="font:400 11px ${mono};color:${PG.muted}">NuGet downloads</span></div>
              <div style="display:flex;align-items:flex-end;font:400 11px ${mono};color:${PG.muted}">${v.statsNote}</div>
            </div>
          </div>

          <div class="wrap">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px" role="tablist" aria-label="Projects">
              ${v.projects.map(p => html`
                <button class="tile" role="tab" aria-selected=${p.on} aria-controls="stage" @click=${() => this.select(p.id)} style="--hov:${p.tileHover};text-align:left;cursor:pointer;border:0;border-radius:10px;padding:18px 18px 16px;background:${p.tileBg};color:${p.tileFg};display:flex;flex-direction:column;gap:14px;font-family:'Schibsted Grotesk',sans-serif;box-shadow:inset 0 0 0 1px ${p.tileRing};transition:background .2s">
                  <div style="display:flex;justify-content:space-between;align-items:center;width:100%"><span style="width:10px;height:10px;border-radius:50%;background:${p.accent}"></span><span style="font:400 11px ${mono};opacity:.7">${p.num}</span></div>
                  <span style="font-weight:700;font-size:20px;letter-spacing:-.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span>
                  <div style="display:flex;justify-content:space-between;gap:8px;width:100%;font:400 11px ${mono};opacity:.7"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.tag}</span><span style="white-space:nowrap;flex-shrink:0">★ ${p.stars}</span></div>
                </button>`)}
            </div>
          </div>

          <div class="wrap" style="padding-top:16px;padding-bottom:96px">
            <section id="stage" class="stage" role="tabpanel" aria-label=${cur.name} style="background:${stg.bg};color:${stg.fg};box-shadow:inset 0 0 0 1px ${PG.stageBorder};border-radius:16px;display:flex;flex-direction:column;gap:40px;transition:background .3s">
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:32px;align-items:end">
                <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
                  <span style="font:400 12px ${mono};color:${acc}">${cur.num} / ${cur.tag}</span>
                  <h2 style="margin:0;font-weight:800;font-size:${cur.name.length > 10 ? 'clamp(36px,5.6vw,80px)' : 'clamp(44px,8vw,112px)'};line-height:.85;letter-spacing:-.055em;overflow-wrap:break-word">${cur.name}</h2>
                </div>
                <div style="display:flex;flex-direction:column;gap:12px">
                  <p style="margin:0;font-size:22px;line-height:1.3;font-weight:500;letter-spacing:-.01em;text-wrap:pretty">${cur.headline}</p>
                  <p style="margin:0;font-size:15px;line-height:1.6;color:${stg.muted};text-wrap:pretty">${cur.blurb}</p>
                </div>
              </div>

              ${demos[cur.id]()}

              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:stretch">
                <pre style="margin:0;background:${stg.panel};border-radius:12px;padding:24px;font:400 13px/1.7 ${mono};color:${stg.fg2};overflow:auto">${cur.code}</pre>
                <div style="display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:8px 0">
                  <div style="display:flex;gap:32px">
                    <div style="display:flex;flex-direction:column;gap:4px"><span style="font-weight:800;font-size:36px;letter-spacing:-.04em;line-height:1">${cur.stars}</span><span style="font:400 11px ${mono};color:${stg.muted}">stars</span></div>
                    <div style="display:flex;flex-direction:column;gap:4px"><span style="font-weight:800;font-size:36px;letter-spacing:-.04em;line-height:1">${cur.dl}</span><span style="font:400 11px ${mono};color:${stg.muted}">downloads</span></div>
                  </div>
                  <button @click=${() => { try { navigator.clipboard.writeText('dotnet add package ' + cur.pkg); } catch (e) {} this.setState({ copied: true }); }} style="display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid ${stg.line};background:transparent;color:${stg.fg2};border-radius:8px;padding:14px 16px;cursor:pointer;font:400 12px ${mono};text-align:left"><span style="overflow-wrap:anywhere">dotnet add package ${cur.pkg}</span><span style="color:${acc}">${s.copied ? 'copied' : 'copy'}</span></button>
                  <div style="display:flex;gap:10px;flex-wrap:wrap">
                    <a href=${cur.docs} style="flex:1;min-width:200px;background:${acc};color:${stg.bg};border-radius:8px;padding:18px 20px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center"><span>Explore ${cur.name}</span><span aria-hidden="true">→</span></a>
                    <a href=${cur.url} style="border:1px solid ${stg.line};border-radius:8px;padding:18px 20px;font-weight:500;font-size:17px">GitHub ↗</a>
                  </div>
                  <button class="next" @click=${() => this.select(v.nxt.id)} style="--fg:${stg.fg};align-self:flex-start;border:0;background:transparent;padding:0;color:${stg.muted};cursor:pointer;font:400 12px ${mono}">Next: ${v.nxt.name} →</button>
                </div>
              </div>
            </section>
          </div>
        </main>

        <footer class="wrap" style="padding-bottom:48px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:400 12px ${mono};color:${PG.muted}"><span>Tom Longhurst · Software Engineer</span><a href="https://github.com/sponsors/thomhurst">Sponsor on GitHub ↗</a></footer>
      </div>`, this.root);
  }
}

new Portfolio(document.getElementById('app'));
</script>
</body>
</html>

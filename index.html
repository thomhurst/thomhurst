<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tom Longhurst</title>
<meta name="description" content="Tom Longhurst builds open-source .NET tools, including the TUnit testing framework, ModularPipelines, Dekaf, Respire, Kevlar and BDTest.">
<meta property="og:title" content="Tom Longhurst">
<meta property="og:description" content="Open-source .NET tools: TUnit, ModularPipelines, Dekaf, Respire, Kevlar and BDTest.">
<meta property="og:url" content="https://tomlonghurst.dev/">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232340E0'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3ETL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --fog: #E8ECEF;
    --ink: #16202E;
    --slate: #556273;
    --rule: #C6CED7;
    --cobalt: #2340E0;
    --fail: #C8382E;
    --panel: #DCE2E8;
    --display: "Anybody", "Arial Narrow", sans-serif;
    --body: "Schibsted Grotesk", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fog: #11161E;
      --ink: #E4E9EF;
      --slate: #95A2B2;
      --rule: #2A3443;
      --cobalt: #8FA2FF;
      --fail: #F07B6E;
      --panel: #19202B;
    }
  }
  :root[data-theme="dark"] {
    --fog: #11161E;
    --ink: #E4E9EF;
    --slate: #95A2B2;
    --rule: #2A3443;
    --cobalt: #8FA2FF;
    --fail: #F07B6E;
    --panel: #19202B;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--fog);
    color: var(--ink);
    font: 400 1rem/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible {
    outline: 3px solid var(--cobalt);
    outline-offset: 4px;
    border-radius: 2px;
  }

  .page {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-columns: minmax(0, 1fr);
    max-width: 90rem;
    margin: 0 auto;
    padding: 0 clamp(1rem, 3.5vw, 3rem);
  }

  /* Header */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 1.5rem 0;
    font-size: 0.9375rem;
  }
  .top nav { display: flex; gap: 1.25rem; }
  .top a { text-decoration: none; color: var(--slate); }
  .top a:hover { color: var(--ink); }
  .top .mark { font-weight: 700; color: var(--ink); }

  main {
    display: grid;
    grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
    gap: clamp(2rem, 5vw, 5rem);
    padding-bottom: clamp(1.5rem, 3vh, 2.5rem);
    min-height: 0;
  }

  /* Left: intro and project tabs */
  .side { display: flex; flex-direction: column; min-height: 0; }
  .side h1 {
    margin: 0 0 0.75rem;
    font-family: var(--display);
    font-weight: 800;
    font-variation-settings: "wdth" 62;
    font-size: clamp(2.25rem, min(4.4vw, 7vh), 4rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    max-width: 11em;
  }
  .side > p {
    margin: 0 0 clamp(1.25rem, 4vh, 2.5rem);
    color: var(--slate);
    max-width: 30em;
  }

  .tabs {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    border-top: 2px solid var(--ink);
  }
  .tab {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    width: 100%;
    padding: clamp(0.3rem, 1vh, 0.6rem) 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    background: none;
    color: var(--slate);
    cursor: pointer;
    text-align: left;
    font: inherit;
  }
  .tab-name {
    font-family: var(--display);
    font-weight: 700;
    font-variation-settings: "wdth" 66;
    font-size: clamp(1.75rem, min(4.2vw, 6.2vh), 3.75rem);
    line-height: 1;
    letter-spacing: -0.015em;
    transition: font-variation-settings 420ms cubic-bezier(.2,.7,.2,1), color 200ms;
  }
  .tab:hover .tab-name { color: var(--ink); font-variation-settings: "wdth" 90; }
  .tab[aria-selected="true"] .tab-name { color: var(--cobalt); font-variation-settings: "wdth" 104; }
  .tab-stars { font-size: 0.875rem; font-weight: 500; white-space: nowrap; }
  .tab-progress {
    position: absolute;
    left: 0;
    bottom: -1px;
    height: 2px;
    width: 100%;
    background: var(--cobalt);
    transform: scaleX(0);
    transform-origin: left;
  }

  /* Right: stage */
  .stage {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .screen {
    position: relative;
    flex: 1 1 auto;
    min-height: 14rem;
    background: var(--panel);
    border-radius: 10px;
    overflow: hidden;
  }
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .status {
    position: absolute;
    left: 1rem;
    bottom: 0.8rem;
    font: 500 0.8125rem/1 var(--mono);
    color: var(--slate);
  }
  .copy {
    /* fixed height so the screen does not jump between projects */
    height: 12.5rem;
    padding-top: clamp(1rem, 2.5vh, 1.75rem);
    transition: opacity 220ms;
  }
  .copy.swap { opacity: 0; }
  .copy h2 {
    margin: 0 0 0.35rem;
    font-size: 1.25rem;
    line-height: 1.3;
  }
  .copy p {
    margin: 0 0 0.9rem;
    color: var(--slate);
    max-width: 38em;
  }
  .copy code {
    display: block;
    margin: 0 0 0.9rem;
    padding: 0.55rem 0.8rem;
    background: var(--panel);
    border-radius: 4px;
    font: 400 0.8125rem/1.5 var(--mono);
    overflow-x: auto;
    white-space: pre;
  }
  .copy code:empty { display: none; }
  .links { display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; font-weight: 500; }
  .links a {
    color: var(--cobalt);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  .links a:hover { text-decoration-thickness: 2px; }

  /* One screen on desktop; normal scroll on small or short screens */
  @media (min-width: 900px) and (min-height: 640px) {
    body { height: 100dvh; overflow: hidden; }
    .page { height: 100dvh; }
  }
  @media (max-width: 899px), (max-height: 639px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .tabs { margin-top: 0; }
    .screen { flex: none; height: min(60vw, 20rem); }
  }

  /* Page load: tab names open from narrow to set width, once */
  @media (prefers-reduced-motion: no-preference) {
    .js .tab-name { animation: open 900ms cubic-bezier(.2,.7,.2,1) backwards; }
    .js .tab:nth-child(2) .tab-name { animation-delay: 60ms; }
    .js .tab:nth-child(3) .tab-name { animation-delay: 120ms; }
    .js .tab:nth-child(4) .tab-name { animation-delay: 180ms; }
    .js .tab:nth-child(5) .tab-name { animation-delay: 240ms; }
    .js .tab:nth-child(6) .tab-name { animation-delay: 300ms; }
    @keyframes open {
      from { font-variation-settings: "wdth" 50; opacity: 0; }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .tab-name, .copy { transition: none; }
  }
</style>
<script>document.documentElement.classList.add("js");</script>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="mark" href="/">Tom Longhurst</a>
    <nav aria-label="Elsewhere">
      <a href="https://github.com/thomhurst">GitHub</a>
      <a href="https://github.com/sponsors/thomhurst">Sponsor</a>
    </nav>
  </header>

  <main>
    <section class="side">
      <h1>I build tools .NET developers run every day.</h1>
      <p>Test frameworks, messaging clients, resilience and CI pipelines, all in plain C#. Based in London, and a photographer when away from the keyboard.</p>
      <div class="tabs" role="tablist" aria-label="Open-source projects"></div>
    </section>

    <section class="stage" id="stage" role="tabpanel" aria-live="polite">
      <div class="screen">
        <canvas aria-hidden="true"></canvas>
        <span class="status" aria-hidden="true"></span>
      </div>
      <div class="copy">
        <h2></h2>
        <p></p>
        <code></code>
        <div class="links">
          <a data-docs>Read the docs</a>
          <a data-source>View source</a>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const projects = [
  {
    repo: "TUnit", name: "TUnit", stars: 3979, docs: "https://tunit.dev/",
    title: "A modern testing framework for .NET",
    text: "Tests are found at compile time by source generators, run in parallel by default and work under Native AOT. Built on Microsoft.Testing.Platform.",
    code: "await Assert.That(total).IsEqualTo(expected);",
    scene: "tunit",
  },
  {
    repo: "ModularPipelines", name: "Modular Pipelines", stars: 558, docs: "https://thomhurst.github.io/ModularPipelines/",
    title: "CI/CD pipelines written in C#",
    text: "Replace YAML with modules that declare their dependencies. Set a breakpoint, step through the pipeline and fix it before you push.",
    code: "[DependsOn<BuildModule>]\npublic class PublishModule : Module<CommandResult>",
    scene: "pipelines",
  },
  {
    repo: "Dekaf", name: "Dekaf", stars: 91, docs: "https://thomhurst.github.io/Dekaf/",
    title: "A Kafka client in pure C#",
    text: "Speaks the Kafka wire protocol directly, with no librdkafka and no native dependencies. Zero-allocation hot paths, Native AOT support, and retry topics and dead letter queues built in.",
    code: "",
    scene: "dekaf",
  },
  {
    repo: "BDTest", name: "BDTest", stars: 91, docs: "https://thomhurst.github.io/BDTest/",
    title: "Behaviour-driven testing without Gherkin",
    text: "Write Given, When and Then scenarios in C#, run them with your usual test framework, and share readable HTML reports.",
    code: "",
    scene: "bdtest",
  },
  {
    repo: "Respire", name: "Respire", stars: 21, docs: "https://thomhurst.github.io/Respire/",
    title: "A fast Redis client for .NET",
    text: "Plain C# types in, plain C# types out. Works with Redis, Valkey, KeyDB and other RESP servers, with no multiplexer to configure.",
    code: "User? user = await redis.GetAsync<User>(\"user:1\");",
    scene: "respire",
  },
  {
    repo: "Kevlar", name: "Kevlar", stars: 21, docs: "https://thomhurst.github.io/Kevlar/",
    title: "Readable resilience for .NET",
    text: "Retries, circuit breakers, timeouts, rate limiting, hedging and fallbacks in one fluent API. Build a shield once and reuse it with ordinary delegates.",
    code: "var shield = Shield.Retry(3);",
    scene: "kevlar",
  },
];

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.querySelector(".status");
let W = 0, H = 0, colors = {};

function readColors() {
  const s = getComputedStyle(document.documentElement);
  for (const k of ["ink", "slate", "rule", "cobalt", "fail", "panel", "fog"]) colors[k] = s.getPropertyValue("--" + k).trim();
}
readColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); redrawIfStill(); });

function resize() {
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene) scene.layout();
  redrawIfStill();
}
new ResizeObserver(resize).observe(canvas);

const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
}
function mono(size, weight = 400) { ctx.font = `${weight} ${size}px "JetBrains Mono", ui-monospace, monospace`; }

/* Scenes. Each one has layout(), step(dt) and draw(), and sets status text. */
const scenes = {
  // Tests run in parallel across workers and turn solid when they pass.
  tunit() {
    let cells = [], cols, rows, size, gap, ox, oy, clock, hold;
    const workers = 24;
    function reset() {
      clock = 0; hold = 0;
      cells.forEach((c) => { c.state = 0; c.t = 0; c.dur = rand(0.12, 0.9); });
    }
    return {
      layout() {
        size = Math.max(9, Math.min(18, Math.floor(Math.min(W, H) / 22)));
        gap = Math.round(size * 0.45);
        cols = Math.floor((W - 48) / (size + gap));
        rows = Math.floor((H - 70) / (size + gap));
        const n = cols * rows;
        cells = Array.from({ length: n }, () => ({}));
        ox = (W - (cols * (size + gap) - gap)) / 2;
        oy = (H - 30 - (rows * (size + gap) - gap)) / 2;
        reset();
      },
      step(dt) {
        clock += dt;
        let running = 0, passed = 0;
        for (const c of cells) {
          if (c.state === 1) {
            c.t += dt;
            if (c.t >= c.dur) { c.state = 2; c.t = 0; }
          }
          if (c.state === 1) running++;
          if (c.state === 2) { passed++; c.t += dt; }
        }
        for (let i = 0; i < cells.length && running < workers; i++) {
          if (cells[i].state === 0) { cells[i].state = 1; cells[i].t = 0; running++; }
        }
        if (passed === cells.length) {
          hold += dt;
          if (hold > 1.6) reset();
        }
        statusEl.textContent = `${passed}/${cells.length} passed  ${running} running  ${(passed === cells.length ? clock - hold : clock).toFixed(2)}s`;
      },
      draw() {
        cells.forEach((c, i) => {
          const x = ox + (i % cols) * (size + gap), y = oy + Math.floor(i / cols) * (size + gap);
          roundRect(x, y, size, size, 2.5);
          if (c.state === 0) { ctx.strokeStyle = colors.rule; ctx.lineWidth = 1.5; ctx.stroke(); }
          else if (c.state === 1) {
            ctx.globalAlpha = 0.35 + 0.35 * Math.sin(c.t * 18);
            ctx.fillStyle = colors.cobalt; ctx.fill(); ctx.globalAlpha = 1;
          } else {
            ctx.fillStyle = c.t < 0.25 ? colors.cobalt : colors.ink; ctx.fill();
          }
        });
      },
    };
  },

  // Modules start as soon as their dependencies finish.
  pipelines() {
    const mods = [
      { id: "Restore", col: 0, row: 1, deps: [] },
      { id: "Lint", col: 2, row: 0, deps: ["Restore"] },
      { id: "Build", col: 1, row: 2, deps: ["Restore"] },
      { id: "UnitTests", col: 2, row: 1, deps: ["Build"] },
      { id: "IntegrationTests", col: 2, row: 3, deps: ["Build"] },
      { id: "Pack", col: 3, row: 2, deps: ["UnitTests", "IntegrationTests", "Lint"] },
      { id: "Publish", col: 4, row: 2, deps: ["Pack"] },
    ];
    const byId = Object.fromEntries(mods.map((m) => [m.id, m]));
    let nw, nh, clock, hold;
    function reset() {
      clock = 0; hold = 0;
      mods.forEach((m) => { m.state = 0; m.t = 0; m.dur = rand(0.7, 1.8); });
    }
    reset();
    return {
      layout() {
        nw = Math.min(150, (W - 60) / 5 - 16);
        nh = Math.max(26, Math.min(36, H / 9));
        const cw = (W - 40) / 5, rh = (H - 50) / 4;
        mods.forEach((m) => { m.x = 20 + m.col * cw + (cw - nw) / 2; m.y = 14 + m.row * rh + (rh - nh) / 2; });
      },
      step(dt) {
        clock += dt;
        let done = 0;
        for (const m of mods) {
          if (m.state === 0 && m.deps.every((d) => byId[d].state === 2)) { m.state = 1; m.t = 0; }
          if (m.state === 1) { m.t += dt; if (m.t >= m.dur) { m.state = 2; m.t = 0; } }
          else if (m.state === 2) { m.t += dt; done++; }
        }
        const active = mods.filter((m) => m.state === 1).map((m) => m.id);
        if (done === mods.length) { hold += dt; if (hold > 1.8) reset(); }
        statusEl.textContent = done === mods.length ? `pipeline succeeded in ${(clock - hold).toFixed(1)}s` : `running ${active.join(", ") || "..."}`;
      },
      draw() {
        ctx.lineWidth = 1.5;
        for (const m of mods) for (const d of m.deps) {
          const a = byId[d], x1 = a.x + nw, y1 = a.y + nh / 2, x2 = m.x, y2 = m.y + nh / 2, mx = (x1 + x2) / 2;
          ctx.strokeStyle = a.state === 2 ? colors.slate : colors.rule;
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.bezierCurveTo(mx, y1, mx, y2, x2, y2); ctx.stroke();
          if (a.state === 2 && a.t < 0.6) {
            const t = ease(a.t / 0.6), u = 1 - t;
            const px = u*u*u*x1 + 3*u*u*t*mx + 3*u*t*t*mx + t*t*t*x2;
            const py = u*u*u*y1 + 3*u*u*t*y1 + 3*u*t*t*y2 + t*t*t*y2;
            ctx.fillStyle = colors.cobalt; ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.fill();
          }
        }
        // fit the longest module name inside a node
        mono(Math.max(7, Math.min(12, (nw - 10) / 10)), 500);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        for (const m of mods) {
          roundRect(m.x, m.y, nw, nh, 5);
          ctx.fillStyle = m.state === 2 ? colors.ink : colors.fog; ctx.fill();
          ctx.strokeStyle = m.state === 1 ? colors.cobalt : m.state === 2 ? colors.ink : colors.rule;
          ctx.lineWidth = m.state === 1 ? 2 : 1.5; ctx.stroke();
          if (m.state === 1) {
            ctx.fillStyle = colors.cobalt; ctx.globalAlpha = 0.18;
            roundRect(m.x, m.y, nw * Math.min(m.t / m.dur, 1), nh, 5); ctx.fill(); ctx.globalAlpha = 1;
          }
          ctx.fillStyle = m.state === 2 ? colors.fog : m.state === 1 ? colors.cobalt : colors.slate;
          ctx.fillText(m.id, m.x + nw / 2, m.y + nh / 2 + 1);
        }
        ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
      },
    };
  },

  // A producer appends records to partitions; a consumer reads them off the end.
  dekaf() {
    const lanes = 4;
    let msgs = [], next = [0, 0, 0, 0], consumed = 0, x0, x1, laneY, laneH, spawn = 0;
    return {
      layout() {
        x0 = 70; x1 = W - 70;
        laneH = Math.min(46, (H - 80) / lanes);
        const top = (H - 30 - lanes * laneH * 1.35) / 2;
        laneY = Array.from({ length: lanes }, (_, i) => top + i * laneH * 1.35);
      },
      step(dt) {
        spawn -= dt;
        while (spawn <= 0) {
          spawn += rand(0.05, 0.16);
          const lane = Math.floor(Math.random() * lanes);
          const tail = msgs.find((o) => o.lane === lane && o.offset === next[lane] - 1);
          if (!tail || tail.x > x0 + laneH) msgs.push({ lane, x: x0, offset: next[lane]++, v: rand(150, 230) });
        }
        const w = laneH * 0.7;
        for (let i = msgs.length - 1; i >= 0; i--) {
          const m = msgs[i];
          // keep a gap behind the record ahead in the same partition
          const ahead = msgs.find((o) => o !== m && o.lane === m.lane && o.offset === m.offset - 1);
          const limit = ahead ? ahead.x - w - 4 : Infinity;
          m.x = Math.min(m.x + m.v * dt, limit);
          if (m.x > x1 - w) { msgs.splice(i, 1); consumed++; }
        }
        statusEl.textContent = `topic orders  ${lanes} partitions  ${consumed.toLocaleString("en-GB")} records consumed`;
      },
      draw() {
        const w = laneH * 0.7;
        mono(10, 500); ctx.textBaseline = "middle";
        laneY.forEach((y, i) => {
          ctx.strokeStyle = colors.rule; ctx.lineWidth = 1.5;
          roundRect(x0 - 4, y - 4, x1 - x0 + 8, laneH + 8, 6); ctx.stroke();
          ctx.fillStyle = colors.slate; ctx.textAlign = "right";
          ctx.fillText(`p${i}`, x0 - 12, y + laneH / 2);
          ctx.textAlign = "left";
          ctx.fillText(`${next[i]}`, x1 + 12, y + laneH / 2);
        });
        for (const m of msgs) {
          const y = laneY[m.lane];
          roundRect(m.x, y + (laneH - w) / 2, w, w, 3);
          ctx.fillStyle = m.x > x1 - w * 3 ? colors.cobalt : colors.ink; ctx.fill();
        }
        ctx.textBaseline = "alphabetic"; ctx.textAlign = "start";
      },
    };
  },

  // Given / When / Then steps type out and pass, then the report updates.
  bdtest() {
    const scenarios = [
      ["Given a basket with 2 items", "When the customer checks out", "Then an order is created", "And a receipt is emailed"],
      ["Given an expired discount code", "When it is applied to the basket", "Then the total is unchanged", "And a warning is shown"],
      ["Given a registered customer", "When they reset their password", "Then a reset link is sent"],
    ];
    let s = 0, line = 0, chars = 0, pause = 0, passed = 0;
    return {
      layout() {},
      step(dt) {
        const steps = scenarios[s];
        if (pause > 0) { pause -= dt; if (pause <= 0 && line >= steps.length) { s = (s + 1) % scenarios.length; line = 0; chars = 0; } return; }
        chars += dt * 38;
        if (chars >= steps[line].length) {
          chars = steps[line].length;
          line++; chars = 0;
          pause = line >= steps.length ? 2.2 : 0.35;
          if (line >= steps.length) passed++;
        }
        statusEl.textContent = `${passed} scenarios passed`;
      },
      draw() {
        const steps = scenarios[s];
        const size = Math.max(12, Math.min(22, W / 30));
        const x = Math.max(24, W * 0.08), lh = size * 2.1;
        let y = (H - 30 - (steps.length + 1.5) * lh) / 2 + size;
        mono(size * 0.8, 500); ctx.fillStyle = colors.slate;
        ctx.fillText(`Scenario ${s + 1}`, x, y); y += lh * 1.2;
        steps.forEach((text, i) => {
          if (i > line) return;
          const shown = i < line ? text : text.slice(0, Math.floor(chars));
          const [kw, ...rest] = shown.split(" ");
          mono(size, 500);
          ctx.fillStyle = colors.cobalt; ctx.fillText(kw, x + size * 1.8, y);
          const kwW = ctx.measureText(kw + " ").width;
          mono(size, 400);
          ctx.fillStyle = colors.ink; ctx.fillText(rest.join(" "), x + size * 1.8 + kwW, y);
          if (i < line) {
            ctx.strokeStyle = colors.ink; ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(x, y - size * 0.35); ctx.lineTo(x + size * 0.35, y); ctx.lineTo(x + size * 0.95, y - size * 0.75); ctx.stroke();
          } else if (Math.floor(performance.now() / 400) % 2) {
            ctx.fillStyle = colors.cobalt;
            ctx.fillRect(x + size * 1.8 + ctx.measureText(shown).width + 2, y - size * 0.8, size * 0.5, size);
          }
          y += lh;
        });
      },
    };
  },

  // Pipelined commands travel to the server and replies come back.
  respire() {
    const cmds = [
      ["GET user:1", "User { Ada, 36 }"], ["SET cart:9", "OK"], ["INCR visits", "1,024"],
      ["HGET order:3 total", "42.50"], ["EXPIRE session:7 300", "1"], ["GET user:2", "User { Lin, 29 }"],
    ];
    let packets = [], spawn = 0, done = 0, xc, xs, keys = [], k = 0;
    return {
      layout() {
        xc = Math.max(40, W * 0.12); xs = W - Math.max(40, W * 0.12);
        keys = Array.from({ length: 12 }, (_, i) => ({ i, glow: 0 }));
      },
      step(dt) {
        spawn -= dt;
        if (spawn <= 0) {
          spawn = rand(0.45, 0.8);
          const [req, res] = cmds[k++ % cmds.length];
          packets.push({ req, res, t: 0, lane: k % 5, key: Math.floor(Math.random() * 12) });
        }
        for (let i = packets.length - 1; i >= 0; i--) {
          const p = packets[i];
          const before = p.t;
          p.t += dt / 2.6;
          if (before < 0.5 && p.t >= 0.5) keys[p.key].glow = 1;
          if (p.t >= 1) { packets.splice(i, 1); done++; }
        }
        keys.forEach((kk) => (kk.glow = Math.max(0, kk.glow - dt * 1.5)));
        statusEl.textContent = `${packets.length} in flight  ${done.toLocaleString("en-GB")} replies`;
      },
      draw() {
        const top = 50, bottom = H - 50;
        const fs = Math.max(11, Math.min(14, W / 46));
        // client and server columns
        ctx.strokeStyle = colors.rule; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(xc, top); ctx.lineTo(xc, bottom); ctx.stroke();
        mono(fs, 500); ctx.fillStyle = colors.slate; ctx.textAlign = "center";
        ctx.fillText("app", xc, top - 18);
        ctx.fillText("redis", xs, top - 18);
        const cols = 3, cell = Math.min(22, (bottom - top) / 6), gx = xs - (cols * (cell + 5)) / 2;
        const gy = (top + bottom) / 2 - (4 * (cell + 5)) / 2;
        keys.forEach((kk) => {
          const x = gx + (kk.i % cols) * (cell + 5), y = gy + Math.floor(kk.i / cols) * (cell + 5);
          roundRect(x, y, cell, cell, 3);
          ctx.fillStyle = kk.glow > 0 ? colors.cobalt : colors.ink;
          ctx.globalAlpha = 0.25 + 0.75 * kk.glow; ctx.fill(); ctx.globalAlpha = 1;
        });
        const left = xc + 14, right = gx - 14;
        for (const p of packets) {
          const y = top + 16 + p.lane * ((bottom - top - 32) / 4);
          const out = p.t < 0.5, u = ease(out ? p.t * 2 : (p.t - 0.5) * 2);
          const x = out ? lerp(left, right, u) : lerp(right, left, u);
          const label = out ? p.req : p.res;
          ctx.textAlign = out ? "right" : "left";
          ctx.fillStyle = out ? colors.ink : colors.cobalt;
          ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
          ctx.globalAlpha = Math.min(1, Math.sin(u * Math.PI) * 3);
          ctx.fillText(label, out ? x - 10 : x + 10, y + 4);
          ctx.globalAlpha = 1;
        }
        ctx.textAlign = "start";
      },
    };
  },

  // Calls go through the shield; failures are retried and enough of them open the circuit.
  kevlar() {
    let calls = [], spawn = 0, xs, xsh, xsvc, ok = 0, retries = 0, breaker = "closed", fails = 0, openFor = 0, outage = 0;
    return {
      layout() { xs = 30; xsh = W * 0.42; xsvc = W - 90; },
      step(dt) {
        // the service has occasional bad spells
        outage -= dt;
        if (outage < -6) outage = rand(1.8, 2.8);
        const failRate = outage > 0 ? 0.85 : 0.12;
        if (breaker === "open") { openFor -= dt; if (openFor <= 0) breaker = "half-open"; }
        spawn -= dt;
        if (spawn <= 0) { spawn = rand(0.18, 0.35); calls.push({ x: xs, y: rand(0.15, 0.85), dir: 1, attempt: 1, state: "out", t: 0 }); }
        for (let i = calls.length - 1; i >= 0; i--) {
          const c = calls[i];
          c.t += dt;
          if (c.state === "out") {
            c.x += 260 * dt;
            if (breaker === "open" && c.x >= xsh && c.x < xsh + 8) { c.state = "rejected"; c.t = 0; }
            else if (c.x >= xsvc) {
              if (Math.random() < failRate) {
                c.state = "back"; fails++;
                if (fails >= 4 && breaker !== "open") { breaker = "open"; openFor = 2.2; fails = 0; }
              } else { c.state = "done"; c.t = 0; ok++; fails = 0; if (breaker === "half-open") breaker = "closed"; }
            }
          } else if (c.state === "back") {
            c.x -= 320 * dt;
            if (c.x <= xsh) {
              if (c.attempt < 3) { c.attempt++; retries++; c.state = "out"; }
              else { c.state = "rejected"; c.t = 0; }
            }
          } else if (c.t > 0.5) calls.splice(i, 1);
        }
        statusEl.textContent = `circuit ${breaker}  ${ok} succeeded  ${retries} retries`;
      },
      draw() {
        const top = 50, h = H - 100;
        mono(Math.max(11, Math.min(14, W / 46)), 500); ctx.fillStyle = colors.slate; ctx.textAlign = "center";
        ctx.fillText("calls", xs + 30, top - 18);
        ctx.fillText(breaker === "closed" ? "shield" : `circuit ${breaker}`, xsh - 20, top - 18);
        ctx.fillText(outage > 0 ? "service failing" : "service", xsvc + 13, top - 18);
        ctx.textAlign = "start";
        // service
        roundRect(xsvc, top, 26, h, 5);
        ctx.fillStyle = outage > 0 ? colors.fail : colors.ink; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;
        // shield
        ctx.strokeStyle = breaker === "open" ? colors.fail : colors.cobalt;
        ctx.lineWidth = breaker === "open" ? 5 : 3;
        ctx.setLineDash(breaker === "half-open" ? [8, 8] : []);
        ctx.beginPath(); ctx.ellipse(xsh - 40, top + h / 2, 40, h / 2, 0, -Math.PI / 2, Math.PI / 2); ctx.stroke();
        ctx.setLineDash([]);
        for (const c of calls) {
          const y = top + c.y * h, fade = c.state === "done" || c.state === "rejected" ? 1 - c.t / 0.5 : 1;
          ctx.globalAlpha = Math.max(0, fade);
          ctx.fillStyle = c.state === "back" || c.state === "rejected" ? colors.fail : c.state === "done" ? colors.cobalt : colors.ink;
          ctx.beginPath(); ctx.arc(c.x, y, 3 + c.attempt * 1.5, 0, 7); ctx.fill();
          ctx.globalAlpha = 1;
        }
      },
    };
  },
};

/* Tabs */
const tablist = document.querySelector(".tabs");
const stage = document.getElementById("stage");
const copy = document.querySelector(".copy");
let current = -1, scene = null, auto = !reduceMotion, autoT = 0;
const AUTO_SECONDS = 8;

projects.forEach((p, i) => {
  const b = document.createElement("button");
  b.className = "tab";
  b.id = `tab-${p.repo}`;
  b.setAttribute("role", "tab");
  b.setAttribute("aria-controls", "stage");
  b.innerHTML = `<span class="tab-name">${p.name}</span><span class="tab-stars"><span data-stars>${p.stars.toLocaleString("en-GB")}</span> stars</span><span class="tab-progress"></span>`;
  b.addEventListener("click", () => { stopAuto(); select(i); });
  b.addEventListener("keydown", (e) => {
    const d = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
    if (d) { e.preventDefault(); stopAuto(); select((current + d + projects.length) % projects.length, true); }
  });
  tablist.appendChild(b);
});
tablist.addEventListener("pointerenter", stopAuto);
stage.addEventListener("pointerenter", stopAuto);

function stopAuto() {
  auto = false;
  document.querySelectorAll(".tab-progress").forEach((el) => (el.style.transform = "scaleX(0)"));
}

function select(i, focus) {
  if (i === current) return;
  current = i; autoT = 0;
  const p = projects[i];
  document.querySelectorAll(".tab").forEach((b, j) => {
    b.setAttribute("aria-selected", String(j === i));
    b.tabIndex = j === i ? 0 : -1;
    b.querySelector(".tab-progress").style.transform = "scaleX(0)";
    if (j === i && focus) b.focus();
  });
  stage.setAttribute("aria-labelledby", `tab-${p.repo}`);
  const fill = () => {
    copy.querySelector("h2").textContent = p.title;
    copy.querySelector("p").textContent = p.text;
    copy.querySelector("code").textContent = p.code;
    copy.querySelector("[data-docs]").href = p.docs;
    copy.querySelector("[data-source]").href = `https://github.com/thomhurst/${p.repo}`;
    copy.classList.remove("swap");
  };
  if (reduceMotion || !copy.querySelector("h2").textContent) fill();
  else { copy.classList.add("swap"); setTimeout(fill, 180); }
  scene = scenes[p.scene]();
  if (W) scene.layout();
  if (reduceMotion) settle();
}

// With reduced motion, run each scene forward and show one still frame.
function settle() {
  for (let k = 0; k < 240; k++) scene.step(1 / 60);
  draw();
}
function redrawIfStill() { if (reduceMotion && scene) draw(); }

function draw() {
  ctx.clearRect(0, 0, W, H);
  scene.draw();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (scene && W) { scene.step(dt); draw(); }
  if (auto) {
    autoT += dt;
    document.querySelector('.tab[aria-selected="true"] .tab-progress').style.transform = `scaleX(${Math.min(autoT / AUTO_SECONDS, 1)})`;
    if (autoT >= AUTO_SECONDS) select((current + 1) % projects.length);
  }
  requestAnimationFrame(frame);
}

select(0);
if (!reduceMotion) requestAnimationFrame(frame);
document.fonts && document.fonts.ready.then(redrawIfStill);

// Refresh star counts from GitHub; the numbers above are the fallback.
projects.forEach(async (p) => {
  try {
    const res = await fetch(`https://api.github.com/repos/thomhurst/${p.repo}`);
    if (!res.ok) return;
    const { stargazers_count } = await res.json();
    if (typeof stargazers_count === "number") {
      document.querySelector(`#tab-${p.repo} [data-stars]`).textContent = stargazers_count.toLocaleString("en-GB");
    }
  } catch {}
});
</script>
</body>
